<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ink Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 20h9'/%3E%3Cpath d='M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #eef0f3;
    --bar: #ffffff;
    --bar-border: #dfe2e7;
    --text: #1f2328;
    --muted: #6b7280;
    --hover: #f1f3f5;
    --active: #e3ecfd;
    --accent: #2563eb;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
    --menu: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191a1c;
      --bar: #232427;
      --bar-border: #34363a;
      --text: #e8e9eb;
      --muted: #9ba1a9;
      --hover: #2e3034;
      --active: #263552;
      --accent: #6b9bff;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
      --menu: #2a2b2f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191a1c; --bar: #232427; --bar-border: #34363a; --text: #e8e9eb; --muted: #9ba1a9;
    --hover: #2e3034; --active: #263552; --accent: #6b9bff; --menu: #2a2b2f;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .bar {
    flex: none; display: flex; align-items: center; gap: 4px;
    padding: 6px 8px; background: var(--bar); border-bottom: 1px solid var(--bar-border);
    overflow-x: auto; scrollbar-width: none; position: relative; z-index: 5;
  }
  .bar::-webkit-scrollbar { display: none; }
  .grp { display: flex; align-items: center; gap: 2px; flex: none; }
  .sep { width: 1px; height: 24px; background: var(--bar-border); margin: 0 4px; flex: none; }
  .tb {
    flex: none; width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent;
    color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .tb:hover { background: var(--hover); }
  .tb[aria-pressed="true"] { background: var(--active); color: var(--accent); }
  .tb:disabled { opacity: .35; cursor: default; background: transparent; }
  .tb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sw {
    flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--bar);
    box-shadow: 0 0 0 1px var(--bar-border); cursor: pointer; padding: 0; margin: 0 2px;
  }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
  .custom { position: relative; overflow: hidden; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
  .custom input { position: absolute; inset: -8px; opacity: 0; cursor: pointer; }
  .size { width: 30px; }
  .size i { display: block; border-radius: 50%; background: currentColor; }
  select {
    flex: none; height: 30px; border-radius: 8px; border: 1px solid var(--bar-border);
    background: var(--bar); color: var(--text); font: inherit; padding: 0 6px;
  }
  .zoom { min-width: 42px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; cursor: pointer; border: 0; background: none; font: inherit; }
  .pageind { flex: none; margin-left: auto; padding-left: 8px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .sync { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; background: var(--muted); opacity: .5; }
  .sync[data-s="ok"] { background: #22a35a; opacity: 1; }
  .sync[data-s="saving"], .sync[data-s="offline"] { background: #e8a317; opacity: 1; }
  .sync[data-s="error"] { background: #d93025; opacity: 1; }
  #scroller { flex: 1; overflow: auto; touch-action: none; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #pages { width: max-content; min-width: 100%; padding: 12px 12px 40px; }
  .page {
    position: relative; margin: 0 auto 14px; background: #fff; box-shadow: var(--shadow);
    border-radius: 2px; touch-action: none; cursor: crosshair;
  }
  .page canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .page .num { position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: #9aa1ab; pointer-events: none; }

  .menu {
    position: fixed; top: 50px; right: 8px; z-index: 10; min-width: 230px; padding: 6px;
    background: var(--menu); border: 1px solid var(--bar-border); border-radius: 10px; box-shadow: var(--shadow);
    display: none;
  }
  .menu.open { display: block; }
  .menu button {
    display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--text);
    font: inherit; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  }
  .menu button:hover { background: var(--hover); }
  .menu hr { border: 0; border-top: 1px solid var(--bar-border); margin: 4px 0; }
  .menu .danger { color: #d93025; }

  dialog {
    border: 1px solid var(--bar-border); border-radius: 12px; background: var(--menu); color: var(--text);
    padding: 18px; width: min(460px, calc(100vw - 32px)); box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(0,0,0,.3); }
  dialog h2 { font-size: 15px; margin: 0 0 8px; }
  dialog p { margin: 0 0 12px; color: var(--muted); line-height: 1.45; }
  dialog input[type=text] {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--bar-border);
    background: var(--bg); color: var(--text); font: 12px ui-monospace, Menlo, monospace; user-select: text;
  }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--bar-border); background: var(--bar); color: var(--text); font: inherit;
    padding: 7px 12px; border-radius: 8px; cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: #222; color: #fff; padding: 8px 14px; border-radius: 8px; transition: .2s; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  #print { display: none; }
  @media print {
    @page { size: A4; margin: 0; }
    body { display: block; overflow: visible; background: #fff; }
    body > *:not(#print) { display: none !important; }
    #print { display: block; }
    #print img { display: block; width: 210mm; height: 297mm; page-break-after: always; break-after: page; }
  }
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="grp">
    <button class="tb" data-tool="pen" title="Stift (P)"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    <button class="tb" data-tool="hl" title="Textmarker (H)"><svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></button>
    <button class="tb" data-tool="eraser" title="Radierer (E)"><svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
  </div>
  <div class="sep"></div>
  <div class="grp" id="swatches"></div>
  <div class="sep"></div>
  <div class="grp" id="sizes"></div>
  <div class="sep"></div>
  <div class="grp">
    <button class="tb" id="undo" title="Rückgängig (⌘Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="tb" id="redo" title="Wiederholen (⇧⌘Z)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <select id="paper" title="Papier der aktuellen Seite">
      <option value="lined">Liniert</option>
      <option value="grid">Kariert</option>
      <option value="dots">Punkte</option>
      <option value="blank">Blanko</option>
    </select>
    <button class="tb" id="addPage" title="Seite einfügen"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15h6"/></svg></button>
    <button class="tb" id="delPage" title="Seite löschen"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button class="tb" id="zoomOut" title="Verkleinern"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="zoom" id="zoomLabel" title="Auf Breite einpassen">100%</button>
    <button class="tb" id="zoomIn" title="Vergrößern"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button class="tb" id="menuBtn" title="Mehr"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  </div>
  <span class="pageind"><span class="sync" id="sync" data-s="wait" title="Lädt …"></span><span id="pageInd">1 / 1</span></span>
</header>

<div class="menu" id="menu" role="menu">
  <button data-act="newNotebook">Neues Notizbuch / Embed-Link …</button>
  <button data-act="openTab">In neuem Tab öffnen</button>
  <hr>
  <button data-act="png">Seite als PNG speichern</button>
  <button data-act="pdf">Als PDF drucken / speichern</button>
  <hr>
  <button data-act="backup">Backup exportieren (.json)</button>
  <button data-act="restore">Backup importieren …</button>
  <hr>
  <button data-act="clearPage" class="danger">Aktuelle Seite leeren</button>
</div>

<main id="scroller"><div id="pages"></div></main>

<dialog id="linkDlg">
  <h2>Embed-Link</h2>
  <p>Jede <code>?id=</code> ist ein eigenes Notizbuch. Link kopieren und in Notion mit <b>/embed</b> einfügen.</p>
  <label style="display:block;margin-bottom:4px;color:var(--muted)">Dieses Notizbuch</label>
  <input type="text" id="curLink" readonly>
  <label style="display:block;margin:12px 0 4px;color:var(--muted)">Neues, leeres Notizbuch</label>
  <input type="text" id="newLink" readonly>
  <div class="row">
    <button class="btn" data-copy="curLink">Aktuellen kopieren</button>
    <button class="btn primary" data-copy="newLink">Neuen kopieren</button>
    <button class="btn" id="closeDlg">Schließen</button>
  </div>
</dialog>

<input type="file" id="fileIn" accept="application/json,.json" hidden>
<div id="print"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  // Firebase-Konfiguration für die Synchronisation zwischen Geräten und Notion-Embeds
  // (Firebase-Konsole → Projekteinstellungen → Meine Apps → Web-App → firebaseConfig).
  // null = Notizen werden nur lokal in diesem Browser gespeichert.
  const FIREBASE_CONFIG = {
    apiKey: 'AIzaSyAjd55MPkgp-t0g48a_ysxsLfJydGVlUf4',
    authDomain: 'ink-notes-93986.firebaseapp.com',
    projectId: 'ink-notes-93986',
    storageBucket: 'ink-notes-93986.firebasestorage.app',
    messagingSenderId: '276822658205',
    appId: '1:276822658205:web:b6e2b2a7a271cf05069874',
  };

  const PAGE_W = 1000, PAGE_H = 1414; // A4-Verhältnis, logische Einheiten
  const SIZES = { pen: [1.6, 3, 6], hl: [14, 24, 36], eraser: [12, 28, 60] };
  const PALETTE = {
    pen: ['#1f2328', '#1d4ed8', '#dc2626', '#15803d', '#7c3aed'],
    hl:  ['#facc15', '#4ade80', '#f472b6', '#60a5fa', '#fb923c'],
  };

  const params = new URLSearchParams(location.search);
  const NB_ID = (params.get('id') || 'default').replace(/[^\w-]/g, '').slice(0, 64) || 'default';
  const KEY = 'notebook:' + NB_ID;
  if (params.get('theme') === 'dark' || params.get('theme') === 'light') document.documentElement.dataset.theme = params.get('theme');

  const $ = s => document.querySelector(s);
  const scroller = $('#scroller'), pagesEl = $('#pages');

  // ---------- Einstellungen (pro Gerät) ----------
  const settings = Object.assign({
    tool: 'pen', color: { pen: PALETTE.pen[0], hl: PALETTE.hl[0] }, size: { pen: 1, hl: 1, eraser: 1 },
    zoom: 1,
  }, readJSON('inknotes:settings'));
  function saveSettings() { try { localStorage.setItem('inknotes:settings', JSON.stringify(settings)); } catch {} }
  function readJSON(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } }

  // ---------- Speicher (IndexedDB, Fallback localStorage) ----------
  const store = (() => {
    let dbp;
    const open = () => dbp ||= new Promise((res, rej) => {
      const r = indexedDB.open('inknotes', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('notebooks');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    const req = (mode, fn) => open().then(db => new Promise((res, rej) => {
      const tx = db.transaction('notebooks', mode);
      const q = fn(tx.objectStore('notebooks'));
      tx.oncomplete = () => res(q.result);
      tx.onerror = () => rej(tx.error);
    }));
    return {
      async get(k) {
        try { return await req('readonly', s => s.get(k)); }
        catch { try { return JSON.parse(localStorage.getItem('inknotes:' + k)); } catch { return null; } }
      },
      async set(k, v) {
        try { await req('readwrite', s => s.put(v, k)); }
        catch { localStorage.setItem('inknotes:' + k, JSON.stringify(v)); }
      },
    };
  })();

  // ---------- Datenmodell ----------
  // state.pages = [{ id, paper, strokes: [{ id, tool, color, width, points }] }] ist, was angezeigt wird.
  // canonMeta/canon ist der zuletzt gespeicherte bzw. synchronisierte Stand. Jede Änderung wird per
  // commit() als Differenz (neue/gelöschte Striche, Seitenliste) gespeichert – so können mehrere Geräte
  // gleichzeitig schreiben, ohne sich gegenseitig zu überschreiben.
  const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => (b % 36).toString(36)).join('');
  const strokeId = () => Date.now().toString(36).padStart(9, '0') + rid(4); // chronologisch sortierbar
  const byId = (a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
  function newPage(paper) { return { id: rid(8), paper, strokes: [] }; }

  let state = { pages: [] };
  let canonMeta = [];            // [{ id, paper }]
  const canon = new Map();       // pageId → Map(strokeId → stroke)
  let shownMeta = [], shown = new Map(); // Stand, aus dem state.pages zuletzt aufgebaut wurde
  let ready = false;             // erst zeichnen, wenn der gespeicherte Stand geladen ist

  const metaOf = pages => pages.map(p => ({ id: p.id, paper: p.paper }));
  function markShown() {
    shownMeta = metaOf(state.pages);
    shown = new Map(state.pages.map(p => [p.id, new Map(p.strokes.map(st => [st.id, st]))]));
  }
  // Nur die lokalen Änderungen seit dem letzten Aufbau – Fremdänderungen in canon bleiben unberührt
  function computeDiff() {
    const add = [], del = [], cur = new Map();
    for (const p of state.pages) for (const st of p.strokes) cur.set(st.id, p.id);
    for (const [pid, m] of shown) for (const st of m.values()) if (cur.get(st.id) !== pid) del.push([pid, st]);
    for (const p of state.pages) for (const st of p.strokes) if (!shown.get(p.id)?.has(st.id)) add.push([p.id, st]);
    const metaNow = metaOf(state.pages);
    const meta = JSON.stringify(metaNow) !== JSON.stringify(shownMeta) ? [shownMeta, metaNow] : null;
    return add.length || del.length || meta ? { add, del, meta } : null;
  }
  // 3-Wege-Merge der Seitenliste: lokale Änderung (base → local) auf den aktuellen Stand (remote) anwenden
  function merge3(base, local, remote) {
    const B = new Set(base.map(m => m.id)), L = new Set(local.map(m => m.id)), Rm = new Set(remote.map(m => m.id));
    const bp = new Map(base.map(m => [m.id, m.paper])), rp = new Map(remote.map(m => [m.id, m.paper]));
    const out = local.filter(m => !(B.has(m.id) && !Rm.has(m.id)))
      .map(m => ({ id: m.id, paper: bp.get(m.id) === m.paper && rp.has(m.id) ? rp.get(m.id) : m.paper }));
    remote.forEach((m, i) => {
      if (B.has(m.id) || L.has(m.id)) return;
      const prev = remote.slice(0, i).reverse().find(p => out.some(o => o.id === p.id));
      out.splice(prev ? out.findIndex(o => o.id === prev.id) + 1 : 0, 0, { id: m.id, paper: m.paper });
    });
    return out.length ? out : remote.length ? remote : local;
  }
  function applyCanon(d) {
    for (const [pid, st] of d.del) canon.get(pid)?.delete(st.id);
    for (const [pid, st] of d.add) { if (!canon.has(pid)) canon.set(pid, new Map()); canon.get(pid).set(st.id, st); }
    if (d.meta) canonMeta = merge3(d.meta[0], d.meta[1], canonMeta);
  }
  const invert = d => ({ add: d.del, del: d.add, meta: d.meta && [d.meta[1], d.meta[0]] });

  let remoteChanged = false;
  function commit() {
    const d = computeDiff(); if (!d) return;
    applyCanon(d); backend.write(d);
    undoStack.push(d); if (undoStack.length > 200) undoStack.shift();
    redoStack.length = 0; updateHistoryBtns();
    markShown();
    if (remoteChanged) requestRebuild();
  }
  function rebuild() {
    remoteChanged = false;
    state.pages = canonMeta.map(m => ({ id: m.id, paper: m.paper, strokes: [...(canon.get(m.id)?.values() || [])].sort(byId) }));
    current = Math.max(0, Math.min(current, state.pages.length - 1));
    markShown();
    syncPages();
  }
  // Änderungen von anderen Geräten: während eines Strichs warten
  let rebuildPending = false, rebuildRaf = 0;
  function requestRebuild() {
    remoteChanged = true;
    if (!ready) return;
    if (drawing) { rebuildPending = true; return; }
    if (!rebuildRaf) rebuildRaf = requestAnimationFrame(() => { rebuildRaf = 0; rebuild(); });
  }

  // ---------- Verlauf ----------
  const undoStack = [], redoStack = [];
  function undo() { step(undoStack, redoStack); }
  function redo() { step(redoStack, undoStack); }
  function step(from, to) {
    if (!from.length || drawing) return;
    const d = from.pop(), inv = invert(d);
    applyCanon(inv); backend.write(inv); to.push(inv); rebuild(); updateHistoryBtns();
  }
  function updateHistoryBtns() { $('#undo').disabled = !undoStack.length; $('#redo').disabled = !redoStack.length; }

  // ---------- Kodierung (kompakt: 5 Byte pro Punkt, Base64) ----------
  function encStroke(st) {
    const p = st.points, n = p.length / 3, dv = new DataView(new ArrayBuffer(n * 5));
    const c16 = v => Math.max(-32000, Math.min(32000, Math.round(v * 10)));
    for (let i = 0; i < n; i++) {
      dv.setInt16(i * 5, c16(p[i*3]), true); dv.setInt16(i * 5 + 2, c16(p[i*3+1]), true);
      dv.setUint8(i * 5 + 4, Math.max(0, Math.min(255, Math.round(p[i*3+2] * 255))));
    }
    let bin = ''; const u8 = new Uint8Array(dv.buffer);
    for (let i = 0; i < u8.length; i += 8192) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
    return [st.tool, st.color, st.width, btoa(bin)].join('|');
  }
  function decStroke(id, s) {
    const [tool, color, width, data] = s.split('|');
    const bin = atob(data), n = bin.length / 5, points = new Array(n * 3);
    const u8 = Uint8Array.from(bin, c => c.charCodeAt(0)), dv = new DataView(u8.buffer);
    for (let i = 0; i < n; i++) {
      points[i*3] = dv.getInt16(i * 5, true) / 10; points[i*3+1] = dv.getInt16(i * 5 + 2, true) / 10;
      points[i*3+2] = Math.round(dv.getUint8(i * 5 + 4) / 255 * 100) / 100;
    }
    return { id, tool, color, width: +width, points };
  }

  // Gespeicherte Daten → canon. Versteht v2 (kodiert) und das alte v1-Format (state.pages[].strokes).
  function parseStored(d) {
    const pages = new Map();
    if (d?.v === 2 && Array.isArray(d.meta) && d.meta.length) {
      for (const [pid, m] of Object.entries(d.pages || {})) pages.set(pid, new Map(Object.entries(m).map(([sid, s]) => [sid, decStroke(sid, s)])));
      return { meta: d.meta, pages };
    }
    if (d && Array.isArray(d.pages) && d.pages.length && d.pages.every(p => Array.isArray(p.strokes))) {

    sw.previousElementSibling.style.display = sw.style.display;
    if (t !== 'eraser') {
      for (const c of PALETTE[t]) {
        const b = document.createElement('button'); b.className = 'sw'; b.style.background = c; b.title = c;
        b.setAttribute('aria-pressed', settings.color[t].toLowerCase() === c);
        b.onclick = () => { settings.color[t] = c; saveSettings(); buildToolUI(); };
        sw.append(b);
      }
      const custom = document.createElement('label'); custom.className = 'sw custom'; custom.title = 'Eigene Farbe';
      const isCustom = !PALETTE[t].includes(settings.color[t].toLowerCase());
      custom.setAttribute('aria-pressed', isCustom);
      if (isCustom) custom.style.background = settings.color[t];
      const inp = document.createElement('input'); inp.type = 'color'; inp.value = settings.color[t];
      inp.oninput = () => { settings.color[t] = inp.value; custom.style.background = inp.value; };
      inp.onchange = () => { saveSettings(); buildToolUI(); };
      custom.append(inp); sw.append(custom);
    }
    const sz = $('#sizes'); sz.innerHTML = '';
    SIZES[t].forEach((w, i) => {
      const b = document.createElement('button'); b.className = 'tb size'; b.title = ['Fein', 'Mittel', 'Dick'][i];
      b.setAttribute('aria-pressed', settings.size[t] === i);
      const dot = document.createElement('i'); const d = [5, 9, 14][i];
      dot.style.width = dot.style.height = d + 'px';
      b.append(dot);
      b.onclick = () => { settings.size[t] = i; saveSettings(); buildToolUI(); };
      sz.append(b);
    });
  }
  function setTool(t) { settings.tool = t; saveSettings(); buildToolUI(); }
  document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
  $('#undo').onclick = undo;
  $('#redo').onclick = redo;
  $('#zoomIn').onclick = () => setZoom(settings.zoom * 1.25);
  $('#zoomOut').onclick = () => setZoom(settings.zoom / 1.25);
  $('#zoomLabel').onclick = () => setZoom(1);
  $('#paper').onchange = e => {
    state.pages[current].paper = e.target.value;
    render(views[current]); commit();
  };
  $('#addPage').onclick = () => {
    if (!ready) return;
    state.pages.splice(current + 1, 0, newPage(state.pages[current].paper));
    syncPages(); commit();
    setCurrent(current + 1);
    views[current].el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  $('#delPage').onclick = () => {
    if (state.pages.length <= 1) return;
    if (state.pages[current].strokes.length && !confirm(`Seite ${current + 1} löschen?`)) return;
    state.pages.splice(current, 1);
    current = Math.min(current, state.pages.length - 1);
    syncPages(); commit(); toast('Seite gelöscht – Rückgängig möglich');
  };

  addEventListener('keydown', e => {
    if (e.target.closest('input, select, dialog')) return;
    const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && k === 'y') { e.preventDefault(); redo(); }
    else if (!mod && k === 'p') setTool('pen');
    else if (!mod && k === 'h') setTool('hl');
    else if (!mod && k === 'e') setTool('eraser');
    else if (mod && (k === '=' || k === '+')) { e.preventDefault(); setZoom(settings.zoom * 1.25); }
    else if (mod && k === '-') { e.preventDefault(); setZoom(settings.zoom / 1.25); }
  });
  // Trackpad-Pinch (ctrl+wheel) zoomt die Seiten statt der ganzen Seite
  scroller.addEventListener('wheel', e => { if (e.ctrlKey) { e.preventDefault(); setZoom(settings.zoom * Math.exp(-e.deltaY / 200)); } }, { passive: false });

  // ---------- Menü ----------
  const menu = $('#menu');
  function closeMenu() { menu.classList.remove('open'); }
  $('#menuBtn').onclick = e => { e.stopPropagation(); menu.classList.toggle('open'); };
  addEventListener('pointerdown', e => { if (!e.target.closest('#menu, #menuBtn')) closeMenu(); });
  menu.onclick = e => {
    const act = e.target.closest('button')?.dataset.act; if (!act) return;
    closeMenu(); actions[act]();
  };

  const baseUrl = () => location.origin + location.pathname;
  const actions = {
    newNotebook() {
      const id = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(36).padStart(2, '0')).join('').slice(0, 10);
      $('#curLink').value = baseUrl() + '?id=' + NB_ID;
      $('#newLink').value = baseUrl() + '?id=' + id;
      $('#linkDlg').showModal();
    },
    openTab() { window.open(location.href, '_blank', 'noopener'); },
    async png() {
      const blob = await pageBlob(state.pages[current], 2);
      download(blob, `notiz-${NB_ID}-seite-${current + 1}.png`);
    },
    async pdf() {
      const box = $('#print'); box.innerHTML = '';
      for (const page of state.pages) {
        const img = new Image(); img.src = URL.createObjectURL(await pageBlob(page, 1.6)); box.append(img);
      }
      await Promise.all([...box.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
      window.print();
    },
    backup() {
      download(new Blob([JSON.stringify(exportData())], { type: 'application/json' }), `notizbuch-${NB_ID}.json`);
    },
    restore() { $('#fileIn').click(); },
    clearPage() {
      if (!state.pages[current].strokes.length) return;
      state.pages[current].strokes = []; render(views[current]); commit();
      toast('Seite geleert – Rückgängig möglich');
    },
  };
  function pageBlob(page, scale) {
    const c = document.createElement('canvas'); c.width = PAGE_W * scale; c.height = PAGE_H * scale;
    renderPage(c.getContext('2d'), page, scale);
    return new Promise(res => c.toBlob(res, 'image/png'));
  }
  function download(blob, name) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  $('#fileIn').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const r = parseStored(data);
      if (!r || !ready) throw new Error('Ungültiges Format');
      state.pages = r.meta.map(m => ({ id: m.id, paper: m.paper, strokes: [...(r.pages.get(m.id)?.values() || [])].sort(byId) }));
      current = 0; syncPages(); commit(); toast('Backup importiert – Rückgängig möglich');
    } catch (err) { toast('Import fehlgeschlagen: ' + err.message); }
  };
  $('#closeDlg').onclick = () => $('#linkDlg').close();
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    const inp = $('#' + b.dataset.copy);
    try { await navigator.clipboard.writeText(inp.value); toast('Link kopiert'); }
    catch { inp.select(); document.execCommand('copy') ? toast('Link kopiert') : toast('Bitte manuell kopieren'); }
  });

  const SYNC_LABEL = {
    local: 'Nur lokal gespeichert (keine Synchronisation eingerichtet)', ok: 'Synchronisiert',
    saving: 'Wird synchronisiert …', offline: 'Offline – wird später synchronisiert', error: 'Synchronisationsfehler',
  };
  function setSync(s) { const el = $('#sync'); el.dataset.s = s; el.title = SYNC_LABEL[s]; }

  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- Start ----------
  buildToolUI(); updateHistoryBtns(); syncPages();
  backend.start().catch(err => {
    console.error(err);
    if (backend !== localBackend) { toast('Sync nicht erreichbar – nur lokal gespeichert'); backend = localBackend; localBackend.start(); }
  });
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
})();
</script>
</body>
</html>
